name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Pre-download OpenCV for Build System
        run: |
          mkdir -p opencv
          curl -L "https://github.com" -o opencv.zip
          unzip -q opencv.zip -d opencv
          echo "OpenCV_DIR=$GITHUB_WORKSPACE/opencv/OpenCV-android-sdk/sdk/native/jni" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Find and Upload any APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
