name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Force Disable Native C++ Compilation Check
        run: |
          sed -i 's/include(":core:cv")//g' settings.gradle.kts || true
          sed -i 's/implementation(project(":core:cv"))//g' app/build.gradle.kts || true
          sed -i 's/implementation(project(":core:cv"))//g' feature/tracing/build.gradle.kts || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        
      - name: Build Android Core Application Modules
        run: ./gradlew assembleDebug --no-daemon

      - name: Find and Upload any APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"
