name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Base
        uses: actions/checkout@v4

      - name: Initialize JDK 17 Environment
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Auto-Provision Native NDK Assets
        run: |
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/27.2.12479018" > local.properties
          mkdir -p core/cv/src/main/cpp/opencv
          
      - name: Grant Execute Permissions
        run: chmod +x gradlew
        
      - name: Assemble Core Project Layout
        run: ./gradlew assembleDebug --no-daemon -x test -x lint

      - name: Upload Output Artifact Container
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/build/outputs/apk/**/*.apk"

